name: Build iDeviceInfo

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore iDeviceInfo.csproj

      - name: Build
        run: dotnet build iDeviceInfo.csproj --configuration Release --no-restore

      - name: Publish single-file exe
        run: dotnet publish iDeviceInfo.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/win-x64

      - name: Upload iDeviceInfo.exe
        uses: actions/upload-artifact@v4
        with:
          name: iDeviceInfo-win-x64
          path: ./publish/win-x64/iDeviceInfo.exe
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish for release
        run: dotnet publish iDeviceInfo.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish/win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/win-x64/iDeviceInfo.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
