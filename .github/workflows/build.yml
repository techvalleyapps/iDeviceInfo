name: Build & Release iDeviceInfo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Compute version from run number ───────────────────────────────
      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION"    >> $GITHUB_OUTPUT

      # ── 3. Restore & Publish single-file exe ────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore iDeviceInfo.csproj

      - name: Publish self-contained exe
        run: >
          dotnet publish iDeviceInfo.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}
          -p:FileVersion=${{ steps.version.outputs.VERSION }}
          --output ./publish/win-x64

      # ── 4. Build installer with Inno Setup ───────────────────────────────
      - name: Build installer (Inno Setup)
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          installer\iDeviceInfo.iss
          /DMyAppVersion=${{ steps.version.outputs.VERSION }}

      # ── 5. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "iDeviceInfo ${{ steps.version.outputs.TAG }}"
          body: |
            **iDeviceInfo ${{ steps.version.outputs.TAG }}**

            ### Install
            Download `iDeviceInfoSetup.exe` below and run it.
            The installer will:
            - Install iDeviceInfo to `Program Files\iDeviceInfo`
            - Add it to **Apps & Features** (so you can uninstall it normally)
            - Optionally start it automatically on Windows login

            ### Requirements
            - Windows 10 / 11 (x64)
            - [Apple Devices app](https://apps.microsoft.com/detail/9NP83LWLPZ9K) (or iTunes) installed

            ---
            *Built from commit ${{ github.sha }}*
          files: |
            installer/output/iDeviceInfoSetup.exe
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
